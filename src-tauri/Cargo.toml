[package]
name = "gaia"
version = "0.1.0"
description = "A lifelong personal intelligence"
authors = ["Bo"]
edition = "2021"

[lib]
name = "gaia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
